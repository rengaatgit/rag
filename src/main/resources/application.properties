# ── Server ──────────────────────────────────────────────────────
server.port=8080

# ── Temporal ─────────────────────────────────────────────────────
# Points to your local Temporal server (started via Docker)
spring.temporal.connection.target=127.0.0.1:7233
spring.temporal.namespace=default

# ── External API URLs (replace with real endpoints) ──────────────
app.ocr.api.url=http://localhost:8081/ocr/extract
app.sentiment.api.url=http://localhost:8082/sentiment/analyze

# ── File Upload Directory ─────────────────────────────────────────
app.upload.dir=/tmp/uploads/

# ── Logging ──────────────────────────────────────────────────────
logging.level.com.example.fileprocessor=DEBUG
logging.level.io.temporal=INFO
